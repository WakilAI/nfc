<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fff8fc" />
    <meta name="description" content="Retrouvez tous les liens de COSMABENT : avis Google, Instagram, Facebook, TikTok, téléphone et itinéraire." />
    <meta name="referrer" content="no-referrer" />
    <title>Cosmabent Cosmetics</title>
    <link rel="icon" href="assets/logo.webp" type="image/webp" />
    <link rel="stylesheet" href="styles.css" />
    <script src="links.js" defer></script>
    <script src="page.js" defer></script>
  </head>
  <body>
    <div class="page">
      <header class="hero">
        <div class="hero__mark">
          <img src="assets/logo-transparent.webp" alt="" width="288" height="288" fetchpriority="high" />
        </div>
        <h1 class="hero__name">
          <span class="hero__name-main">Cosmabent</span>
          <span class="hero__name-sub">Cosmetics</span>
        </h1>
        <div class="hero__ornament" aria-hidden="true">
          <span></span>
          <svg viewBox="0 0 24 24"><path d="M12 2c.6 5.4 4.6 9.4 10 10-5.4.6-9.4 4.6-10 10-.6-5.4-4.6-9.4-10-10 5.4-.6 9.4-4.6 10-10Z"/></svg>
          <span></span>
        </div>
      </header>

      <main class="content">
        <nav aria-label="Les liens de COSMABENT">
          <p id="link-status" role="status">Chargement des liens…</p>
          <ul id="links" class="links"></ul>
          <p id="links-empty" class="links-empty" hidden>Les liens officiels arrivent bientôt.</p>
          <noscript><p class="no-script">Activez JavaScript pour afficher les liens de COSMABENT.</p></noscript>
        </nav>
      </main>

      <footer class="footer">
        <svg class="footer__spark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c.6 5.4 4.6 9.4 10 10-5.4.6-9.4 4.6-10 10-.6-5.4-4.6-9.4-10-10 5.4-.6 9.4-4.6 10-10Z"/></svg>
        <p>COSMABENT <span aria-hidden="true">•</span> Cosmétiques</p>
      </footer>
    </div>
  </body>
</html>
