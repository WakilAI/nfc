<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf7f1" />
    <meta name="description" content="Retrouvez tous les liens de Maison Apothicaire : avis Google, site web, Instagram, Facebook, WhatsApp, téléphone et itinéraire." />
    <meta name="referrer" content="no-referrer" />
    <title>Maison Apothicaire — Tous nos liens</title>
    <link rel="icon" href="assets/logo.webp" type="image/webp" />
    <link rel="stylesheet" href="styles.css" />
    <script src="links.js" defer></script>
    <script src="page.js" defer></script>
  </head>
  <body>
    <div class="page">
      <header class="hero">
        <h1 class="hero__brand">
          <img src="assets/lockup.webp" alt="Maison Apothicaire" width="800" height="632" fetchpriority="high" />
        </h1>
        <p class="hero__tagline">Beauté <span aria-hidden="true">·</span> Soins <span aria-hidden="true">·</span> Bien-être</p>
      </header>

      <main class="content">
        <nav aria-label="Les liens de Maison Apothicaire">
          <p id="link-status" role="status">Chargement des liens…</p>
          <ul id="links" class="links"></ul>
          <p id="links-empty" class="links-empty" hidden>Les liens officiels arrivent bientôt.</p>
          <noscript><p class="no-script">Activez JavaScript pour afficher les liens de Maison Apothicaire.</p></noscript>
        </nav>
      </main>

      <footer class="footer">
        <svg class="footer__leaf" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20C4 12 8 6 20 4c-2 12-8 16-16 16Z"/><path d="M4 20c4-6 8-10 12-12"/></svg>
        <p>Maison Apothicaire <span aria-hidden="true">•</span> Alger</p>
      </footer>
    </div>
  </body>
</html>
