<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f1e8fa" />
    <meta name="description" content="Retrouvez tous les liens de Prestige Optic : avis Google, Instagram, Facebook, WhatsApp, téléphone et itinéraire." />
    <meta name="referrer" content="no-referrer" />
    <title>Prestige Optic — Votre vision, notre priorité</title>
    <link rel="icon" href="assets/prestige-optic-logo.webp" type="image/webp" />
    <link rel="stylesheet" href="styles.css" />
    <script src="links.js" defer></script>
    <script src="page.js" defer></script>
  </head>
  <body>
    <div class="page">
      <header class="hero">
        <h1 class="hero__mark">
          <img src="assets/prestige-optic-logo-transparent.webp" alt="Prestige Optic" width="290" height="290" fetchpriority="high" />
        </h1>
        <p class="hero__tagline">Votre vision, notre priorité</p>
        <p class="hero__services">Lunettes <span aria-hidden="true">•</span> Verres <span aria-hidden="true">•</span> Lentilles</p>
      </header>

      <main class="content">
        <nav aria-label="Les liens de Prestige Optic">
          <p id="link-status" role="status">Chargement des liens…</p>
          <ul id="links" class="links"></ul>
          <p id="links-empty" class="links-empty" hidden>Les liens officiels arrivent bientôt.</p>
          <noscript><p class="no-script">Activez JavaScript pour afficher les liens de Prestige Optic.</p></noscript>
        </nav>
      </main>

      <footer class="footer">
        <p>Prestige Optic <span aria-hidden="true">•</span> Votre vision, notre priorité</p>
      </footer>
    </div>
  </body>
</html>
