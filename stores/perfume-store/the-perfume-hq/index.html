<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Retrouvez tous les liens de The Perfume HQ." />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="assets/logo.webp" type="image/webp" />
    <title>The Perfume HQ — Tous nos liens</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="links.js" defer></script>
    <script src="page.js" defer></script>
  </head>
  <body>
    <div class="page">
      <span class="corner corner-top-left" aria-hidden="true"></span>
      <span class="corner corner-top-right" aria-hidden="true"></span>
      <span class="corner corner-bottom-left" aria-hidden="true"></span>
      <span class="corner corner-bottom-right" aria-hidden="true"></span>
      <header class="brand">
        <img src="assets/logo.webp" alt="The Perfume HQ" width="720" height="720" fetchpriority="high" />
      </header>
      <main>
        <nav aria-label="Nos liens">
          <p id="link-status" role="status">Chargement des liens…</p>
          <ul id="links" class="links"></ul>
        </nav>
        <noscript><p>Activez JavaScript pour afficher les liens.</p></noscript>
      </main>
      <footer>The Perfume HQ <span aria-hidden="true">·</span> Parfumerie</footer>
    </div>
  </body>
</html>
