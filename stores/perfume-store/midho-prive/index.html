<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Midho Privé</title>
    <style>
      /* =========================================================
         1. RESET & BASE
         ========================================================= */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        color: #111111;
        -webkit-font-smoothing: antialiased;
        background: linear-gradient(180deg, #ffffff 0%, #f8f8f6 100%);
        width: 100%;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 1.5px solid #111111;
        outline-offset: 3px;
      }

      /* =========================================================
         2. STRUCTURE GENERALE
         ========================================================= */
      .page {
        position: relative;
        width: 100%;
        min-height: 100%;
        background: linear-gradient(180deg, #ffffff 0%, #f8f8f6 100%);
      }

      .decorations {
        position: absolute;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        max-width: 580px;
        left: 0;
        right: 0;
        margin: 0 auto;
        overflow: hidden;
      }

      .main-content {
        position: relative;
        z-index: 2;
        width: 100%;
        max-width: 480px;
        margin: 0 auto;
        padding: clamp(22px, 5.5vw, 32px) 0 clamp(60px, 12vw, 84px);
      }

      /* =========================================================
         3. DECORATIONS — parfum + fleurs
         ========================================================= */
      .deco-parfum {
        position: absolute;
        top: -18px;
        right: -8px;
        width: clamp(145px, 38vw, 195px);
        height: auto;
        object-fit: contain;
        filter: drop-shadow(0 10px 20px rgba(20, 20, 20, 0.08));
      }

      .deco-fleur-gauche {
        position: absolute;
        left: -20px;
        bottom: -15px;
        width: clamp(130px, 34vw, 190px);
        height: auto;
        object-fit: contain;
        filter: drop-shadow(0 10px 24px rgba(20, 20, 20, 0.1));
      }

      .deco-fleur-droite {
        position: absolute;
        right: -20px;
        bottom: -15px;
        width: clamp(130px, 34vw, 190px);
        height: auto;
        object-fit: contain;
        filter: drop-shadow(0 10px 24px rgba(20, 20, 20, 0.1));
      }

      /* =========================================================
         4. LOGO PRINCIPAL
         ========================================================= */
      .logo {
        display: flex;
        justify-content: center;
        align-items: center;
        width: min(195px, 54vw);
        height: 50px;
        margin: 0 auto clamp(34px, 8.5vw, 46px) auto;
        transform: translateX(-20px);
      }

      .logo__img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: center;
        mix-blend-mode: multiply;
      }

      /* =========================================================
         7. BOUTONS SOCIAUX
         ========================================================= */
      .social-list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: clamp(10px, 2.8vw, 13px);
        padding: 0 clamp(16px, 5vw, 28px);
      }

      .social-btn {
        display: flex;
        align-items: center;
        width: 100%;
        max-width: 310px;
        margin: 0 auto;
        height: clamp(52px, 12.5vw, 60px);
        border: 1.5px solid #111111;
        border-radius: 50px;
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        padding: 0 clamp(14px, 4vw, 20px) 0 clamp(12px, 3.6vw, 16px);
        transition:
          background-color 0.2s ease,
          transform 0.15s ease;
      }

      .social-btn:hover,
      .social-btn:focus-visible {
        background-color: rgba(17, 17, 17, 0.04);
      }

      .social-btn:active {
        transform: scale(0.985);
      }

      .social-btn:hover .social-btn__arrow,
      .social-btn:focus-visible .social-btn__arrow {
        transform: translateX(3px);
      }

      .social-btn__icon {
        flex: 0 0 auto;
        width: clamp(28px, 7vw, 32px);
        height: clamp(28px, 7vw, 32px);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .social-btn__icon svg {
        width: 100%;
        height: 100%;
      }

      .social-btn__sep {
        width: 1px;
        height: 24px;
        background: #b8b8b8;
        margin: 0 clamp(10px, 3vw, 16px);
        flex-shrink: 0;
      }

      .social-btn__label {
        flex: 1 1 auto;
        min-width: 0;
        font-size: clamp(11.5px, 3.2vw, 13px);
        font-weight: 500;
        letter-spacing: 0.26em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .social-btn__arrow {
        flex: 0 0 auto;
        width: clamp(18px, 4.8vw, 22px);
        height: 12px;
        display: flex;
        align-items: center;
        margin-left: auto;
        transition: transform 0.2s ease;
      }

      .social-btn__arrow svg {
        width: 100%;
        height: 100%;
      }

      /* =========================================================
         8. LOGO FINAL
         ========================================================= */
      .final-logo {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: clamp(28px, 8vw, 38px);
        gap: 8px;
      }

      .final-logo__img {
        width: clamp(130px, 36vw, 160px);
        height: clamp(34px, 9vw, 42px);
        object-fit: contain;
        object-position: center;
        mix-blend-mode: multiply;
      }

      .final-logo__tag {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        margin-top: 2px;
      }

      .final-logo__tag span {
        font-size: 9px;
        letter-spacing: 0.3em;
        font-weight: 400;
        color: #444444;
      }

      @media (min-width: 768px) {
        .page {
          display: flex;
          justify-content: center;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    :focus-visible { outline: 3px solid #111; outline-offset: 4px; }
#link-status, noscript p { text-align:center; padding:16px; }
</style>
  <script src="links.js" defer></script>
<script src="page.js" defer></script>
</head>
  <body>
    <div class="page">
      <div class="decorations" aria-hidden="true">
        <img class="deco-parfum" src="images/parfum.png" alt="" />
        <img class="deco-fleur-gauche" src="images/fleur-gauche.png" alt="" />
        <img class="deco-fleur-droite" src="images/fleur-droite.png" alt="" />
      </div>

      <main class="main-content">
        <div class="logo">
          <img class="logo__img" src="images/logo.png" alt="Midho Privé" />
        </div>

        <p id="link-status" role="status">Chargement des liens…</p>
<ul id="links" class="social-list"></ul>
<noscript><p>Activez JavaScript pour afficher les liens.</p></noscript>

        <div class="final-logo">
          <img
            class="final-logo__img"
            src="images/logo.png"
            alt="Midho Privé"
          />
          <div class="final-logo__tag">
            <span>PLUS QU'UN PARFUM</span>
            <span>UNE SIGNATURE</span>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
