<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Retrouvez tous les liens de Nessah Travel." />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#082849" />
    <link rel="icon" href="assets/logo.webp" />
    <title>Nessah Travel — Tous nos liens</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="links.js" defer></script>
    <script src="page.js" defer></script>
  </head>
  <body>
    <div class="page">
      <header class="brand">
        <img src="assets/logo.webp" alt="Nessah Travel" width="623" height="490" fetchpriority="high" />
      </header>
      <main>
        <nav aria-label="Nos liens">
          <p id="link-status" role="status">Chargement des liens…</p>
          <ul id="links" class="links"></ul>
        </nav>
        <noscript><p>Activez JavaScript pour afficher les liens.</p></noscript>
      </main>
      <footer class="footer"><span>Nessah Travel</span><span>Agence de voyages</span></footer>
    </div>
  </body>
</html>
