<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#690b08" />
    <meta name="description" content="Tous les liens d'Ino Burger : avis Google, Instagram, TikTok, WhatsApp, téléphone et itinéraire." />
    <meta name="referrer" content="no-referrer" />
    <title>Ino Burger — Tous nos liens</title>
    <link rel="icon" href="references/logo.jpg" type="image/jpeg" />
    <script src="links.js" defer></script>
    <script src="page.js" defer></script>
    <style>
      :root {
        color-scheme: light;
        --cream: #fff4d9;
        --paper: #fffaf0;
        --red: #a51e1b;
        --wine: #690b08;
        --yellow: #ffce35;
        --ink: #4d2018;
        --muted: #7a4b3a;
        --line: #d9bda1;
        font-family: "Trebuchet MS", Arial, sans-serif;
        color: var(--ink);
        background: var(--wine);
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 280px; }
      ::selection { color: var(--cream); background: var(--red); }
      html { scrollbar-color: var(--red) var(--cream); }
      .page {
        width: min(100%, 480px);
        margin: 32px auto;
        background: var(--cream);
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 18px 64px #27030055;
      }
      .brand {
        position: relative;
        display: grid;
        place-items: center;
        background: #480000;
        border-bottom: 5px solid var(--yellow);
      }
      .brand img { display: block; width: 200px; height: 200px; object-fit: contain; }
      .brand::before, .brand::after {
        content: "";
        position: absolute;
        top: 30px;
        bottom: 30px;
        width: 4px;
        border-inline: 1px solid #ffce3570;
      }
      .brand::before { left: 25px; }
      .brand::after { right: 25px; }
      main { padding: 18px 26px 28px; }
      .links { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
      .links a {
        display: flex;
        align-items: center;
        gap: 14px;
        min-height: 70px;
        padding: 13px 16px;
        color: var(--ink);
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 12px;
        text-decoration: none;
        transition: background-color .2s ease, border-color .2s ease, transform .2s ease;
      }
      .links li:first-child a { color: var(--cream); background: var(--red); border-color: var(--red); }
      .link-icon { display: flex; flex: 0 0 25px; color: var(--red); }
      .links li:first-child .link-icon { color: var(--yellow); }
      .link-text { min-width: 0; flex: 1; overflow-wrap: anywhere; }
      .link-label { display: block; font-size: 16px; font-weight: 700; line-height: 1.3; }
      .link-detail { display: block; margin-top: 3px; color: var(--muted); font-size: 13px; line-height: 1.4; }
      .links li:first-child .link-detail { color: var(--cream); }
      .link-arrow { flex: 0 0 20px; display: flex; }
      svg { width: 100%; height: auto; }
      a:focus-visible { outline: 3px solid var(--wine); outline-offset: 4px; }
      @media (hover: hover) {
        .links a:hover { background: #ffe9af; border-color: var(--red); transform: translateY(-2px); }
        .links li:first-child a:hover { background: var(--wine); }
      }
      .links a:active { transform: translateY(1px); }
      #link-status { line-height: 1.5; text-align: center; color: var(--red); }
      #link-status[hidden] { display: none; }
      footer { text-align: center; }
      footer p { margin: 0; padding: 0 20px 24px; color: var(--red); font: italic 19px Georgia, serif; }
      .checker {
        height: 24px;
        background: conic-gradient(var(--red) 25%, transparent 0 50%, var(--red) 0 75%, transparent 0) 0 0 / 24px 24px;
      }
      @keyframes welcome { from { clip-path: inset(0 0 12%); } to { clip-path: inset(0); } }
      .brand img { animation: welcome .8s cubic-bezier(.16, 1, .3, 1); }
      @media (max-width: 520px), (pointer: coarse) {
        .page { margin: 0 auto; border-radius: 0; min-height: 100svh; box-shadow: none; }
        .brand { padding-top: env(safe-area-inset-top); }
        main { padding-left: max(18px, env(safe-area-inset-left)); padding-right: max(18px, env(safe-area-inset-right)); }
        .checker { height: calc(24px + env(safe-area-inset-bottom)); }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; transition: none !important; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="brand">
        <img src="references/logo.jpg" alt="Ino Burgers" width="200" height="200" fetchpriority="high" />
      </header>
      <main>
        <nav aria-label="Les liens d'Ino Burger">
          <p id="link-status" role="status">Chargement des liens…</p>
          <ul id="links" class="links"></ul>
        </nav>
        <noscript><p>Activez JavaScript pour afficher les liens d'Ino Burger.</p></noscript>
      </main>
      <footer>
        <p>À très vite chez Ino.</p>
        <div class="checker" aria-hidden="true"></div>
      </footer>
    </div>
  </body>
</html>
