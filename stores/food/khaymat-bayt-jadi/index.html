<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2b1a10" />
    <meta name="description" content="Tous les liens de خيمة بيت جدي, cuisine traditionnelle algérienne : avis Google, Facebook, WhatsApp, téléphone et itinéraire." />
    <meta name="referrer" content="no-referrer" />
    <title>خيمة بيت جدي — Tous nos liens</title>
    <link rel="icon" href="assets/logo.webp" type="image/webp" />
    <link rel="stylesheet" href="styles.css" />
    <script src="links.js" defer></script>
    <script src="page.js" defer></script>
  </head>
  <body>
    <div class="page">
      <header class="brand">
        <img src="assets/logo.webp" alt="خيمة بيت جدي" width="640" height="640" fetchpriority="high" />
        <h1 lang="ar" dir="rtl">خيمة بيت جدي</h1>
        <p class="tagline" lang="ar" dir="rtl">مأكولات تقليدية جزائرية</p>
      </header>
      <main>
        <nav aria-label="Nos liens">
          <p id="link-status" role="status">Chargement des liens…</p>
          <ul id="links" class="links"></ul>
        </nav>
        <noscript><p>Activez JavaScript pour afficher les liens.</p></noscript>
      </main>
      <footer class="signature">
        <p class="signature-name" lang="ar" dir="rtl">خيمة بيت جدي</p>
        <p class="signature-tagline" lang="ar" dir="rtl">مأكولات تقليدية جزائرية</p>
      </footer>
      <div class="corners" aria-hidden="true">
        <i class="corner tl"></i>
        <i class="corner tr"></i>
        <i class="corner bl"></i>
        <i class="corner br"></i>
      </div>
    </div>
  </body>
</html>
