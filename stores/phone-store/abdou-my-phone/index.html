<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />
    <title>Abdou My Phone — Téléphones &amp; accessoires</title>
    <meta
      name="description"
      content="Retrouvez tous les liens de Abdou My Phone : contact, réseaux sociaux et localisation."
    />
    <link rel="icon" href="assets/abdou-my-phone-logo.jpg" type="image/jpeg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Caveat:wght@700&display=swap"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="links.js" defer></script>
    <script src="page.js" defer></script>
  </head>

  <body>
    <div class="page">
      <!-- ═══════════ HERO ═══════════ -->
      <section class="hero">
        <!-- Vagues NFC, reprenant le pictogramme des plaques fournies -->
        <div class="hero-waves" aria-hidden="true">
          <svg viewBox="0 0 190 190" fill="none">
            <defs>
              <linearGradient id="wavesGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#1DA7EA" stop-opacity="0.7" />
                <stop offset="100%" stop-color="#0C7DC0" stop-opacity="0.25" />
              </linearGradient>
            </defs>
            <g stroke="url(#wavesGrad)" stroke-linecap="round" fill="none">
              <circle cx="10" cy="10" r="26" stroke-width="3" />
              <path d="M44 -14 A 66 66 0 0 1 -14 44" stroke-width="3" />
              <path d="M62 -32 A 92 92 0 0 1 -32 62" stroke-width="3" />
            </g>
          </svg>
        </div>
        <div class="hero-waves hero-waves--left" aria-hidden="true">
          <svg viewBox="0 0 190 190" fill="none">
            <g stroke="#1DA7EA" stroke-linecap="round" fill="none">
              <circle cx="10" cy="10" r="26" stroke-width="3" />
              <path d="M44 -14 A 66 66 0 0 1 -14 44" stroke-width="3" />
              <path d="M62 -32 A 92 92 0 0 1 -32 62" stroke-width="3" />
            </g>
          </svg>
        </div>

        <div class="hero-logo">
          <img
            src="assets/abdou-my-phone-logo.jpg"
            alt="Logo officiel Abdou My Phone"
            width="626"
            height="626"
            decoding="async"
            fetchpriority="high"
          />
        </div>

        <h1 class="hero-brand">
          Abdou <span class="brand-blue">My Phone</span>
        </h1>
        <p class="hero-tagline">Téléphones &amp; accessoires</p>
      </section>

      <!-- ═══════════ CARTES ═══════════ -->
      <p id="link-status" role="status">Chargement des liens…</p>
      <nav id="links" class="cards" aria-label="Liens Abdou My Phone"></nav>
      <noscript><p>Activez JavaScript pour afficher les liens.</p></noscript>

      <footer>
        <p class="ft-script">Restez connectés</p>
        <svg
          class="ft-underline"
          viewBox="0 0 120 14"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <path
            d="M4 10 C 40 15, 80 12, 116 4"
            stroke="#1DA7EA"
            stroke-width="2.4"
            stroke-linecap="round"
          />
        </svg>
        <p class="ft-note">Abdou My Phone · Téléphones &amp; accessoires</p>
      </footer>
    </div>
  </body>
</html>
