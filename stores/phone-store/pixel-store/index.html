<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05070d" />
    <meta name="description" content="Retrouvez tous les liens de Pixel Store : avis Google, Instagram, TikTok, WhatsApp et itinéraire." />
    <meta name="referrer" content="no-referrer" />
    <title>Pixel Store — Téléphones &amp; accessoires</title>
    <link rel="icon" href="assets/pixel-store-logo.webp" type="image/webp" />
    <link rel="stylesheet" href="styles.css" />
    <script src="links.js" defer></script>
    <script src="page.js" defer></script>
  </head>
  <body>
    <div class="page">
      <header class="hero">
        <h1 class="hero__brand">
          <span class="hero__word">pixe<span class="hero__lite">l</span></span>
          <span class="hero__store">
            <span class="hero__rule" aria-hidden="true"></span>
            <span>Store</span>
            <span class="hero__rule" aria-hidden="true"></span>
          </span>
        </h1>
        <p class="hero__tagline">Téléphones &amp; accessoires</p>
      </header>

      <main class="content">
        <nav aria-label="Les liens de Pixel Store">
          <p id="link-status" role="status">Chargement des liens…</p>
          <ul id="links" class="links"></ul>
          <p id="links-empty" class="links-empty" hidden>Les liens officiels arrivent bientôt.</p>
          <noscript><p class="no-script">Activez JavaScript pour afficher les liens de Pixel Store.</p></noscript>
        </nav>
      </main>

      <footer class="footer">
        <p>Pixel Store <span aria-hidden="true">•</span> Téléphones &amp; accessoires</p>
      </footer>
    </div>
  </body>
</html>
