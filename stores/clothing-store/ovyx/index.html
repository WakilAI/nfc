<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0b" />
    <meta name="description" content="Retrouvez tous les liens d’OVYX : avis Google, Instagram, Facebook, TikTok, téléphone et itinéraire." />
    <meta name="referrer" content="no-referrer" />
    <title>OVYX — Prêt-à-porter féminin</title>
    <link rel="icon" href="assets/ovyx-logo.webp" type="image/webp" />
    <link rel="stylesheet" href="styles.css" />
    <script src="links.js" defer></script>
    <script src="page.js" defer></script>
  </head>
  <body>
    <div class="page">
      <header class="hero">
        <h1 class="hero__mark">
          <img src="assets/ovyx-logo-transparent.webp" alt="OVYX" width="270" height="270" fetchpriority="high" />
        </h1>
        <p class="hero__tagline">Prêt-à-porter féminin</p>
      </header>

      <main class="content">
        <nav aria-label="Les liens d’OVYX">
          <p id="link-status" role="status">Chargement des liens…</p>
          <ul id="links" class="links"></ul>
          <p id="links-empty" class="links-empty" hidden>Les liens officiels arrivent bientôt.</p>
          <noscript><p class="no-script">Activez JavaScript pour afficher les liens d’OVYX.</p></noscript>
        </nav>
      </main>

      <footer class="footer">
        <span class="footer__rule" aria-hidden="true"></span>
        <p>OVYX <span aria-hidden="true">•</span> Prêt-à-porter féminin</p>
      </footer>
    </div>
  </body>
</html>
