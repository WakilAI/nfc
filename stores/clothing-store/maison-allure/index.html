<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Retrouvez tous les liens de Maison Allure." />
    <meta name="referrer" content="no-referrer" />
    <title>Maison Allure — Tous nos liens</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="links.js" defer></script>
    <script src="page.js" defer></script>
  </head>
  <body>
    <div class="page">
      <header class="brand">
        <img src="assets/logo.jpg" alt="" width="200" height="200" fetchpriority="high" />
        <h1>Maison Allure</h1>
      </header>
      <main>
        <nav aria-label="Nos liens">
          <p id="link-status" role="status">Chargement des liens…</p>
          <ul id="links" class="links"></ul>
        </nav>
        <noscript><p>Activez JavaScript pour afficher les liens.</p></noscript>
      </main>
    </div>
  </body>
</html>
